name: Prepare release

on:
   workflow_dispatch:
      inputs:
         version:
            description: "Version bump or explicit version such as 17.2.14"
            required: true
            default: patch
            type: string

permissions:
   contents: write
   actions: write

concurrency:
   group: release-preparation
   cancel-in-progress: false

jobs:
   release:
      name: Prepare and publish release
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-22.04
      environment: release
      timeout-minutes: 90
      env:
         GH_TOKEN: ${{ github.token }}
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install

         - name: Verify release branch
           run: |
              test "$(git branch --show-current)" = main
              test -z "$(git status --porcelain)"

         - name: Create release commit and tag
           env:
              RELEASE_VERSION: ${{ inputs.version }}
           run: bun scripts/release.ts "$RELEASE_VERSION"
